name: healthforecast-ai

services:
  postgres:
    image: postgres:16-alpine
    container_name: healthforecast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-healthforecast}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: healthforecast-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: bring the schema to the current revision before the API starts.
  # The backend image is built once and shared.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: healthforecast-backend:local
    container_name: healthforecast-migrate
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-healthforecast}
      MONGO_URI: mongodb://mongodb:27017
      SECRET_KEY: ${SECRET_KEY:-change-me-do-not-use-in-production}
      MODEL_ARTIFACT_DIR: /models
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: healthforecast-backend:local
    container_name: healthforecast-backend
    restart: unless-stopped
    environment: *backend-env
    env_file:
      - path: .env
        required: false
    volumes:
      # The trained model is an artifact, not source: it is never in the image.
      - ./ml/artifacts:/models:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* at build time; a runtime variable would be ignored.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: healthforecast-frontend
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
