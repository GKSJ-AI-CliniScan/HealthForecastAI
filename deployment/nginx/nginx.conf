# Reverse proxy for HealthForecast AI.
# Terminate TLS here in production - the app containers must never be public.

upstream healthforecast_backend {
    server backend:8000;
}

upstream healthforecast_frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Security headers - a healthcare dashboard must not be embeddable.
    add_header X-Frame-Options            "DENY"          always;
    add_header X-Content-Type-Options     "nosniff"       always;
    add_header Referrer-Policy            "no-referrer"   always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass         http://healthforecast_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass       http://healthforecast_backend/health;
        access_log       off;
    }

    location / {
        proxy_pass         http://healthforecast_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
    }
}
