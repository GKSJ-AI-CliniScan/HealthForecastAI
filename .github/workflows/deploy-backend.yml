name: Deploy – Backend to Render

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ml/artifacts/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production-use-only
          ENVIRONMENT: test
        run: pytest tests/ -v --tb=short

  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check Render deploy hook
        id: render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not configured; skipping deployment."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Render deploy hook
        if: steps.render.outputs.configured == 'true'
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
