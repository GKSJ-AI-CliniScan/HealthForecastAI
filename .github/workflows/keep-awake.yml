name: Keep Backend Awake

# Render's free instances spin down when idle, and the first request after that
# waits out a cold start of roughly a minute - which looks like a broken app, not
# a sleeping one. This pings the liveness probe to keep it warm.
#
# GitHub's scheduler has a 15-minute floor, and Render idles out at about the same
# interval, so this makes sleepiness unlikely rather than impossible. It also stops
# running if the repository goes 60 days without activity.
#
# Point it at your service by creating a repository variable (Settings → Secrets
# and variables → Variables):
#   RENDER_HEALTH_URL = https://<your-service>.onrender.com/health
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    name: GET /health
    runs-on: ubuntu-latest
    steps:
      - name: Ping the liveness probe
        env:
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::notice::RENDER_HEALTH_URL is not set as a repository variable; nothing to ping."
            exit 0
          fi
          # max-time covers a cold start, and a non-2xx is reported rather than
          # failed - a sleeping service is expected here, a missing one is not.
          status=$(curl --silent --show-error --location \
            --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w '%{http_code}' "$HEALTH_URL") || status=000
          echo "Health probe returned HTTP $status"
          if [ "$status" = "000" ]; then
            echo "::warning::No response from $HEALTH_URL - check the service exists and the URL is right."
          fi
