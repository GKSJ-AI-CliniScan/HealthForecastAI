name: Intern progress report

# With 26 interns on 26 branches and nothing merging into main, there is no
# single place to see who has pushed what. This builds that view: one table of
# every intern branch, its last commit, and its latest CI result.
on:
  schedule:
    # Every Monday at 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      branch_prefix:
        description: 'Branch prefix to report on'
        required: false
        default: 'intern/'

permissions:
  contents: read
  actions: read

jobs:
  report:
    name: Build the progress table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREFIX: ${{ github.event.inputs.branch_prefix || 'intern/' }}
        run: |
          set -euo pipefail

          {
            echo "# Intern progress"
            echo ""
            echo "Generated $(date -u '+%Y-%m-%d %H:%M UTC') for branches starting \`$PREFIX\`."
            echo ""
            echo "| Branch | Last commit | Author | Latest CI |"
            echo "|--------|-------------|--------|-----------|"
          } >> "$GITHUB_STEP_SUMMARY"

          count=0
          while read -r branch; do
            [ -z "$branch" ] && continue
            case "$branch" in
              "$PREFIX"*) ;;
              *) continue ;;
            esac
            count=$((count + 1))

            when=$(git log -1 --format='%ad' --date=short "origin/$branch" 2>/dev/null || echo '-')
            who=$(git log -1 --format='%an' "origin/$branch" 2>/dev/null || echo '-')

            status=$(gh api \
              "repos/$REPO/actions/runs?branch=$(printf '%s' "$branch" | sed 's|/|%2F|g')&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "no runs"' 2>/dev/null || echo 'unknown')

            echo "| \`$branch\` | $when | $who | $status |" >> "$GITHUB_STEP_SUMMARY"
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin \
                   | sed 's|^origin/||' | grep -v '^HEAD$' | sort)

          {
            echo ""
            echo "**$count branch(es)** matched \`$PREFIX\`."
            echo ""
            echo "\`no runs\` means nothing has been pushed to that branch yet."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Reported on $count branch(es)."
