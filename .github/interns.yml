# HealthForecast AI internship roster — 26 interns, AI domain.
# Source: "Predictive Healthcare Intelligence System for Patient Readmission and
# Resource Optimization.xlsx"
#
# This file is the single source of truth for branch naming. CI reads it to verify
# that every pushed branch belongs to a known intern.
#
# Keep the one-line-per-intern format below — the CI parser depends on it.
# Mentors: to add or correct an entry, edit this file on `main` only.
#
# Email addresses are deliberately NOT stored here. The roster needs a name and a
# branch; putting 26 people's personal addresses in a repository does not.

