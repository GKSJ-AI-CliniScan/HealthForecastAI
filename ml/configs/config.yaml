# HealthForecast AI - modelling configuration
# Every experiment must be reproducible from this file alone.

dataset:
  name: india_hospital_readmission_2015_2024
  source: Kaggle - India Hospital Readmission Dataset (2015-2024)
  raw_dir: ml/data/raw_india
  processed_path: ml/data/processed/admissions_features.parquet
  target_column: readmitted_30d
  positive_label: 1
  # NOTE: deviates from the Diabetes 130-US Hospitals dataset named in the
  # original brief - see docs/06-milestones/milestone-1.md for rationale.

split:
  test_size: 0.2
  validation_size: 0.1
  random_state: 42
  stratify: true

preprocessing:
  drop_columns:
    - admission_id
    - patient_id
    - admit_date
    - discharge_date
    - bill_id
  numeric_imputation: median
  categorical_imputation: most_frequent
  scale_numeric: true
  one_hot_encode: true

imbalance:
  strategy: class_weight   # one of: none | class_weight | smote

models:
  logistic_regression:
    enabled: true
    max_iter: 1000
  random_forest:
    enabled: true
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 5
  xgboost:
    enabled: true
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8

evaluation:
  primary_metric: roc_auc
  # Minimum bar for a model to be promoted to the API. Do not lower these.
  thresholds:
    roc_auc: 0.65
    recall: 0.50

risk_bands:
  high: 0.70
  medium: 0.40

artifacts:
  output_dir: ml/artifacts
  model_filename: readmission_model.joblib
  metrics_filename: metrics.json