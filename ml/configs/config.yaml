# HealthForecast AI - modelling configuration
# Every experiment must be reproducible from this file alone.

dataset:
  name: diabetes_130_us_hospitals
  source_url: https://archive.ics.uci.edu/dataset/296/diabetes+130-us-hospitals+for+years+1999-2008
  raw_path: data/raw/diabetic_data.csv
  processed_path: ml/data/processed/admissions_features.parquet
  target_column: readmitted

  # 30-day readmission:
  # "<30" -> 1
  # {">30", "NO"} -> 0
  positive_label: "<30"


# ============================================================
# DATA SPLITTING
# ============================================================

split:
  test_size: 0.2
  validation_size: 0.1
  random_state: 42
  stratify: true


# ============================================================
# PREPROCESSING
# ============================================================

preprocessing:
  # Columns that must NOT be used by the model.
  #
  # encounter_id  -> identifier
  # patient_nbr   -> patient identifier / leakage risk
  # weight        -> very high missingness
  # payer_code    -> high missingness
  #
  # medical_specialty is intentionally KEPT because
  # it is part of the final Colab model's 41 input features.

  drop_columns:
    - encounter_id
    - patient_nbr
    - weight
    - payer_code

  missing_value_token: "?"

  numeric_imputation: median
  categorical_imputation: most_frequent

  scale_numeric: true
  one_hot_encode: true

  # ==========================================================
  # FINAL MODEL INPUT FEATURES
  # ==========================================================
  #
  # These are the EXACT 41 raw input features used by the
  # finalized Colab model.
  #
  # IMPORTANT:
  # Do not add engineered features here unless the final model
  # is retrained with those features.
  #
  # Do not remove medical_specialty.
  #

  model_features:
    - race
    - gender
    - age
    - admission_type_id
    - admission_source_id
    - medical_specialty
    - num_lab_procedures
    - num_procedures
    - num_medications
    - number_outpatient
    - number_emergency
    - number_inpatient
    - diag_1
    - diag_2
    - diag_3
    - number_diagnoses
    - max_glu_serum
    - A1Cresult
    - metformin
    - repaglinide
    - nateglinide
    - chlorpropamide
    - glimepiride
    - acetohexamide
    - glipizide
    - glyburide
    - tolbutamide
    - pioglitazone
    - rosiglitazone
    - acarbose
    - miglitol
    - troglitazone
    - tolazamide
    - insulin
    - glyburide-metformin
    - glipizide-metformin
    - glimepiride-pioglitazone
    - metformin-rosiglitazone
    - metformin-pioglitazone
    - change
    - diabetesMed


# ============================================================
# CLASS IMBALANCE
# ============================================================

imbalance:
  # Supported strategies:
  # none | class_weight | smote

  strategy: class_weight

  # Final selected Colab XGBoost configuration.
  scale_pos_weight: 3.0


# ============================================================
# MODELS
# ============================================================

models:

  # ----------------------------------------------------------
  # Logistic Regression
  # ----------------------------------------------------------
  # Disabled because XGBoost is the final selected model.

  logistic_regression:
    enabled: false


  # ----------------------------------------------------------
  # Random Forest
  # ----------------------------------------------------------
  # Disabled because XGBoost is the final selected model.

  random_forest:
    enabled: false


  # ----------------------------------------------------------
  # XGBoost
  # ----------------------------------------------------------
  # Final selected model.

  xgboost:
    enabled: true

    n_estimators: 400
    max_depth: 5
    learning_rate: 0.03
    min_child_weight: 5
    subsample: 0.8
    colsample_bytree: 0.8

    # Class imbalance handling used by the final model.
    scale_pos_weight: 3.0


# ============================================================
# EVALUATION
# ============================================================

evaluation:
  primary_metric: roc_auc

  # Minimum requirements for model promotion.
  thresholds:
    roc_auc: 0.65
    recall: 0.50

  # ----------------------------------------------------------
  # SERVING / DECISION THRESHOLD
  # ----------------------------------------------------------
  #
  # This is different from the model-promotion thresholds.
  #
  # probability >= 0.30
  #       -> predicted readmission = 1
  #
  # probability < 0.30
  #       -> predicted readmission = 0

  decision_threshold: 0.30


# ============================================================
# RISK BANDS
# ============================================================

# Risk bands are separate from the binary decision threshold.
#
# Probability:
#
#   < 0.40        -> Low
#   0.40 - <0.70  -> Medium
#   >= 0.70       -> High
#
# Example:
#
#   probability = 0.32
#   decision threshold = 0.30
#
#   predicted readmission = 1
#   risk category = Low
#
# This is intentional: prediction threshold and risk band
# represent two different concepts.

risk_bands:
  high: 0.70
  medium: 0.40


# ============================================================
# MODEL ARTIFACTS
# ============================================================

artifacts:
  output_dir: artifacts
  model_filename: readmission_model.joblib
  metrics_filename: metrics.json