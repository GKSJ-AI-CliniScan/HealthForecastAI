# HealthForecast AI - modelling configuration
# Every experiment must be reproducible from this file alone.
#
# `dataset.active` selects which profile trains today.
#
# india_hospital_readmission is the PRIMARY/production dataset (2015-2024,
# per HealthForecastAI_ML_Design.md section 3). diabetes_130_us is kept as a
# fallback/bootstrap profile for local development when the India export is
# not available - both profiles run through the same pipeline code, the same
# way backend/app/services/dataset_import_service.py already supports both
# for the Postgres import path.
#
# The india_hospital_readmission profile below is verified against the real
# Kaggle export in ml/data/raw/ (a relational export: patients.csv,
# admissions.csv, diagnoses.csv, billing.csv, hospitals.csv). It is NOT the
# single-CSV "<30"/">30"/"NO" shape earlier fixtures assumed.

dataset:
  active: india_hospital_readmission
  profiles:
    india_hospital_readmission:
      source_url: "https://www.kaggle.com/datasets/digutlaranjithkumar/india-hospital-readmission-dataset-20152024"
      format: relational
      # Relative to ml/ (modules import as `from src....` with CWD=ml/).
      raw_dir: data/raw
      # Joined patients -> admissions (patient_id) -> diagnoses (admission_id).
      # billing.csv is post-discharge cost and hospitals.csv has no counterpart
      # in the operational schema, so neither feeds the model (see
      # src/features/build_features.py ENCOUNTER_FEATURE_COLUMNS).
      tables:
        patients: patients.csv
        admissions: admissions.csv
        diagnoses: diagnoses.csv
      na_values: ["?", "", "NA", "N/A", "nan", "None", "Unknown/Invalid"]
      id_column: patient_id
      date_column: admission_date
      discharge_date_column: discharge_date
      encounter_key: admission_id
      # Expired encounters are handled per target (exclude_if below) instead.
      leakage_disposition_column: null
      drop_columns: [patient_id, admission_id, admission_date, discharge_date]
      # Outcome columns from the export - never features.
      label_columns: [readmitted_30d, readmitted_7d]
      # Rare categories are handled by OneHotEncoder(min_frequency) fitted on
      # the training split only, not by a full-dataset frequency pass.
      collapse_columns: []
      utilisation_columns: []
      targets:
        readmission:
          description: >-
            30-day readmission after a live discharge: the export's own
            readmitted_30d flag. Expired encounters are excluded - a patient
            who died in hospital cannot be readmitted, and keeping them would
            teach the model that discharge_type=Expired means "no readmission".
          positive_if: {readmitted_30d: [1]}
          exclude_if: {discharge_type: [Expired]}
          exclude_features: []
        risk:
          description: >-
            Adverse encounter outcome: in-hospital death (discharge_type=Expired)
            OR 30-day readmission - the broadest adverse-outcome signal this
            export carries (HealthForecastAI_ML_Design.md section 2).
            discharge_type is part of the label, so it is not a feature.
          positive_if: {readmitted_30d: [1], discharge_type: [Expired]}
          exclude_if: {}
          exclude_features: [discharge_type]
      # 90-day readmission: NOT supported. The export has no 90-day label, and
      # deriving one from admission gaps contradicts its own 30-day labels
      # (only ~1% of admissions have a next admission within 30 days vs an
      # 11.8% labelled rate), so a derived label would be fabricated.
    diabetes_130_us:
      source_url: "https://archive.ics.uci.edu/dataset/296/diabetes+130-us+hospitals+for+years+1999-2008"
      raw_path: data/raw/diabetic_data.csv
      na_values: ["?"]
      id_column: patient_nbr
      date_column: null  # no real calendar dates in this export
      discharge_date_column: null
      encounter_key: encounter_id
      target_column: readmitted
      readmission_positive_label: "<30"
      risk_negative_label: "NO"
      leakage_disposition_column: discharge_disposition_id
      drop_columns: [encounter_id, patient_nbr, weight, payer_code, medical_specialty]
      collapse_columns: [diag_1, diag_2, diag_3]
      utilisation_columns: [number_outpatient, number_emergency, number_inpatient]

split:
  test_size: 0.2
  validation_size: 0.1
  random_state: 42
  stratify: true
  # A temporal split (earliest admissions train, latest test) is used when the
  # active profile has a real date_column - a stronger test of production
  # readiness than a random split (ML Design section 6.10). Falls back to a
  # stratified random split when there is no usable date (diabetes_130_us).
  temporal_when_dated: true

preprocessing:
  numeric_imputation: median
  categorical_imputation: most_frequent
  scale_numeric: true
  rare_category_threshold: 0.01

imbalance:
  # class_weight: LogisticRegression and RandomForest use class_weight="balanced";
  # XGBoost has no such parameter, so its equivalent - scale_pos_weight,
  # computed as negatives/positives on the TRAINING split only - is used
  # instead. "smote" is deferred: imbalanced-learn is already a pinned
  # dependency for a future pass, but resampling needs an imblearn Pipeline
  # in place of sklearn's, which is a larger change than this phase needs
  # given class weighting is already sufficient per the ML Design doc's own
  # risk mitigation table.
  strategy: class_weight # one of: none | class_weight

# Probability calibration (src/models/calibrate.py), fitted on the validation
# split after model selection. Class weighting inflates stated probabilities;
# a calibrated model changes what the API returns and therefore which
# risk_bands patients fall into, so enabling it for a production model needs
# the bands reviewed in the same change. "none" keeps the current behaviour.
calibration:
  method: none # one of: none | sigmoid | isotonic
  folds: 5

# How a probability becomes a yes/no prediction for the reported metrics and
# the promotion check, chosen on validation only (see choose_threshold in
# src/evaluation/metrics.py). fixed 0.5 is the historical behaviour; the API
# itself serves a probability and a risk band, not this threshold.
decision_threshold:
  strategy: fixed # one of: fixed | max_f1 | min_recall
  value: 0.5

models:
  logistic_regression:
    enabled: true
    max_iter: 1000
  random_forest:
    enabled: true
    n_estimators: 300
    max_depth: 12
    min_samples_leaf: 5
  xgboost:
    enabled: true
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8

evaluation:
  primary_metric: roc_auc
  # Minimum bar for a model to be promoted to the API. Do not lower these.
  thresholds:
    roc_auc: 0.65
    recall: 0.50

risk_bands:
  high: 0.70
  medium: 0.40

artifacts:
  output_dir: artifacts # relative to ml/ - see the raw_path comment above
  # {target} is "risk" or "readmission" - each training flow writes its own
  # artefact and metrics file rather than overwriting a shared one.
  model_filename: "{target}_model.joblib"
  metrics_filename: "{target}_metrics.json"
