<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#FAF8F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .text-title { font-size: 18px; font-weight: 700; fill: #1E293B; }
      .text-subtitle { font-size: 12px; font-weight: 500; fill: #64748B; }
      .text-heading { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .text-body { font-size: 12px; font-weight: 500; fill: #334155; }
      .text-caption { font-size: 11px; font-weight: 500; fill: #64748B; }
      .text-bold { font-weight: 700; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 10px; }
      .card-header { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1; }
      .badge-doc { fill: #ECFDF5; stroke: #A7F3D0; stroke-width: 1; rx: 6px; }
      .badge-doc-text { font-size: 11px; font-weight: 700; fill: #047857; }
      .badge-high { fill: #FEF2F2; stroke: #FECACA; stroke-width: 1; rx: 4px; }
      .badge-high-text { font-size: 10px; font-weight: 700; fill: #DC2626; }
      .badge-med { fill: #FFFBEB; stroke: #FDE68A; stroke-width: 1; rx: 4px; }
      .badge-med-text { font-size: 10px; font-weight: 700; fill: #D97706; }
      .btn-primary { fill: #2563EB; rx: 6px; }
      .btn-primary-text { font-size: 11px; font-weight: 600; fill: #FFFFFF; }
      .btn-outline { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 6px; }
      .btn-outline-text { font-size: 11px; font-weight: 600; fill: #475569; }
      .sidebar-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .nav-item-active { fill: #EFF6FF; rx: 6px; }
      .nav-item-active-text { font-size: 12px; font-weight: 700; fill: #1D4ED8; }
      .nav-item-text { font-size: 12px; font-weight: 500; fill: #475569; }
    </style>
  </defs>

  <!-- Top Application Header -->
  <rect x="0" y="0" width="1000" height="56" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  
  <!-- Logo & Title -->
  <rect x="20" y="12" width="32" height="32" rx="8" fill="#2563EB" />
  <path d="M 28 28 L 33 28 L 36 20 L 39 34 L 42 28 L 46 28" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="62" y="32" class="text-title" style="font-size: 15px;">HealthForecast <tspan fill="#2563EB">AI</tspan></text>
  <text x="180" y="32" class="text-subtitle" style="font-size: 11px;">/ Clinical Readmission Intelligence</text>

  <!-- Right Header: Role & User Info -->
  <rect x="680" y="14" width="90" height="26" class="badge-doc" />
  <text x="725" y="31" text-anchor="middle" class="badge-doc-text">Doctor View</text>
  <circle cx="795" cy="28" r="14" fill="#E2E8F0" />
  <text x="795" y="32" text-anchor="middle" font-size="11px" font-weight="700" fill="#475569">SJ</text>
  <text x="818" y="27" font-size="12px" font-weight="700" fill="#1E293B">Dr. Sarah Jenkins, MD</text>
  <text x="818" y="39" class="text-caption" style="font-size: 10px;">Cardiology &amp; Internal Medicine</text>
  <rect x="925" y="16" width="55" height="24" class="btn-outline" />
  <text x="952" y="32" text-anchor="middle" class="btn-outline-text" style="font-size: 10px;">Logout</text>

  <!-- Left Sidebar Navigation -->
  <rect x="0" y="56" width="200" height="624" class="sidebar-bg" />
  
  <text x="20" y="85" font-size="10px" font-weight="700" fill="#94A3B8" letter-spacing="1">MAIN NAVIGATION</text>
  
  <g transform="translate(12, 98)">
    <rect x="0" y="0" width="176" height="34" class="nav-item-active" />
    <circle cx="18" cy="17" r="4" fill="#2563EB" />
    <text x="32" y="21" class="nav-item-active-text">Dashboard</text>
  </g>

  <g transform="translate(12, 138)">
    <rect x="0" y="0" width="176" height="34" fill="transparent" />
    <circle cx="18" cy="17" r="4" fill="#94A3B8" />
    <text x="32" y="21" class="nav-item-text">Patients Directory</text>
  </g>

  <g transform="translate(12, 178)">
    <rect x="0" y="0" width="176" height="34" fill="transparent" />
    <circle cx="18" cy="17" r="4" fill="#94A3B8" />
    <text x="32" y="21" class="nav-item-text">Clinical Alerts</text>
  </g>

  <g transform="translate(12, 218)">
    <rect x="0" y="0" width="176" height="34" fill="transparent" />
    <circle cx="18" cy="17" r="4" fill="#94A3B8" />
    <text x="32" y="21" class="nav-item-text">Treatment Protocols</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(220, 75)">
    <!-- Page Title & Scope Subtitle -->
    <text x="0" y="15" class="text-title">Clinical Overview</text>
    <text x="0" y="32" class="text-subtitle">Doctor-specific caseload metrics and high-priority readmission risks.</text>

    <!-- Role Context Banner -->
    <rect x="0" y="44" width="760" height="36" rx="6" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="1" />
    <text x="12" y="66" font-size="11px" font-weight="600" fill="#15803D">Active Scope: Showing 48 assigned patients under your direct clinical supervision.</text>

    <!-- 4 KPI Headline Cards -->
    <g transform="translate(0, 92)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="178" height="84" class="card" />
      <text x="14" y="22" class="text-caption">Assigned Patients</text>
      <text x="14" y="52" font-size="24px" font-weight="800" fill="#1E293B">48</text>
      <text x="14" y="70" font-size="10px" font-weight="600" fill="#059669">Direct Care Caseload</text>

      <!-- Card 2 -->
      <rect x="194" y="0" width="178" height="84" class="card" />
      <text x="208" y="22" class="text-caption">Active Admissions</text>
      <text x="208" y="52" font-size="24px" font-weight="800" fill="#1E293B">112</text>
      <text x="208" y="70" font-size="10px" font-weight="600" fill="#2563EB">Inpatient Encounters</text>

      <!-- Card 3 -->
      <rect x="388" y="0" width="178" height="84" class="card" />
      <text x="402" y="22" class="text-caption">Readmissions (&lt;30d)</text>
      <text x="402" y="52" font-size="24px" font-weight="800" fill="#DC2626">9</text>
      <text x="402" y="70" font-size="10px" font-weight="600" fill="#DC2626">8.0% Readmission Rate</text>

      <!-- Card 4 -->
      <rect x="582" y="0" width="178" height="84" class="card" />
      <text x="596" y="22" class="text-caption">Avg Length of Stay</text>
      <text x="596" y="52" font-size="24px" font-weight="800" fill="#1E293B">4.2 <tspan font-size="13px" font-weight="500" fill="#64748B">Days</tspan></text>
      <text x="596" y="70" font-size="10px" font-weight="600" fill="#64748B">Target Benchmark: 4.5d</text>
    </g>

    <!-- High-Risk Patient Monitoring Table Section -->
    <g transform="translate(0, 192)">
      <rect x="0" y="0" width="760" height="385" class="card" />
      
      <!-- Table Header Bar -->
      <rect x="0" y="0" width="760" height="42" class="card-header" rx="10" />
      <text x="16" y="26" class="text-heading">High-Risk Patient Monitoring</text>
      <text x="520" y="26" class="text-caption">Showing high-priority patients requiring discharge review</text>

      <!-- Table Column Headers -->
      <line x1="0" y1="72" x2="760" y2="72" stroke="#E2E8F0" stroke-width="1" />
      <text x="16" y="62" font-size="10px" font-weight="700" fill="#64748B">PATIENT / MRN</text>
      <text x="180" y="62" font-size="10px" font-weight="700" fill="#64748B">DEMOGRAPHICS</text>
      <text x="320" y="62" font-size="10px" font-weight="700" fill="#64748B">PRIMARY DIAGNOSIS</text>
      <text x="500" y="62" font-size="10px" font-weight="700" fill="#64748B">RISK TIER</text>
      <text x="660" y="62" font-size="10px" font-weight="700" fill="#64748B">ACTIONS</text>

      <!-- Row 1 -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="760" height="56" fill="#FFFFFF" />
        <line x1="0" y1="56" x2="760" y2="56" stroke="#F1F5F9" stroke-width="1" />
        <text x="16" y="24" font-size="12px" font-weight="700" fill="#1E293B">Arthur Pendleton</text>
        <text x="16" y="40" class="text-caption">MRN-104928 • Inpatient</text>
        <text x="180" y="32" class="text-body">[70-80) Male • Room 402</text>
        <text x="320" y="32" class="text-body">Type 2 Diabetes w/ Ketoacidosis</text>
        <rect x="500" y="19" width="100" height="22" class="badge-high" />
        <text x="550" y="34" text-anchor="middle" class="badge-high-text">HIGH RISK (84%)</text>
        <rect x="660" y="18" width="80" height="24" class="btn-primary" />
        <text x="700" y="33" text-anchor="middle" class="btn-primary-text">View Dossier</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 128)">
        <rect x="0" y="0" width="760" height="56" fill="#FFFFFF" />
        <line x1="0" y1="56" x2="760" y2="56" stroke="#F1F5F9" stroke-width="1" />
        <text x="16" y="24" font-size="12px" font-weight="700" fill="#1E293B">Maria Santos-Cruz</text>
        <text x="16" y="40" class="text-caption">MRN-209841 • Inpatient</text>
        <text x="180" y="32" class="text-body">[50-60) Female • Room 318</text>
        <text x="320" y="32" class="text-body">Congestive Heart Failure</text>
        <rect x="500" y="19" width="100" height="22" class="badge-high" />
        <text x="550" y="34" text-anchor="middle" class="badge-high-text">HIGH RISK (78%)</text>
        <rect x="660" y="18" width="80" height="24" class="btn-primary" />
        <text x="700" y="33" text-anchor="middle" class="btn-primary-text">View Dossier</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 184)">
        <rect x="0" y="0" width="760" height="56" fill="#FFFFFF" />
        <line x1="0" y1="56" x2="760" y2="56" stroke="#F1F5F9" stroke-width="1" />
        <text x="16" y="24" font-size="12px" font-weight="700" fill="#1E293B">James Washington</text>
        <text x="16" y="40" class="text-caption">MRN-391024 • Inpatient</text>
        <text x="180" y="32" class="text-body">[60-70) Male • Room 210</text>
        <text x="320" y="32" class="text-body">COPD Acute Exacerbation</text>
        <rect x="500" y="19" width="100" height="22" class="badge-med" />
        <text x="550" y="34" text-anchor="middle" class="badge-med-text">MEDIUM (62%)</text>
        <rect x="660" y="18" width="80" height="24" class="btn-primary" />
        <text x="700" y="33" text-anchor="middle" class="btn-primary-text">View Dossier</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 240)">
        <rect x="0" y="0" width="760" height="56" fill="#FFFFFF" />
        <line x1="0" y1="56" x2="760" y2="56" stroke="#F1F5F9" stroke-width="1" />
        <text x="16" y="24" font-size="12px" font-weight="700" fill="#1E293B">Robert Henderson</text>
        <text x="16" y="40" class="text-caption">MRN-410293 • Inpatient</text>
        <text x="180" y="32" class="text-body">[40-50) Male • Room 114</text>
        <text x="320" y="32" class="text-body">Acute Myocardial Infarction</text>
        <rect x="500" y="19" width="100" height="22" class="badge-med" />
        <text x="550" y="34" text-anchor="middle" class="badge-med-text">MEDIUM (55%)</text>
        <rect x="660" y="18" width="80" height="24" class="btn-primary" />
        <text x="700" y="33" text-anchor="middle" class="btn-primary-text">View Dossier</text>
      </g>

      <!-- Table Footer / Pagination -->
      <g transform="translate(16, 310)">
        <text x="0" y="16" class="text-caption">Showing 4 of 48 assigned patients</text>
        <rect x="620" y="0" width="55" height="24" class="btn-outline" />
        <text x="647" y="16" text-anchor="middle" class="btn-outline-text" style="font-size: 10px;">Previous</text>
        <rect x="682" y="0" width="55" height="24" class="btn-outline" />
        <text x="709" y="16" text-anchor="middle" class="btn-outline-text" style="font-size: 10px;">Next</text>
      </g>
    </g>
  </g>
</svg>
