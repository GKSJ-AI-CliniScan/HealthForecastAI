<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" style="background:#FAF8F5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <style>
      .text-title { font-size: 18px; font-weight: 700; fill: #1E293B; }
      .text-subtitle { font-size: 12px; font-weight: 500; fill: #64748B; }
      .text-heading { font-size: 14px; font-weight: 700; fill: #1E293B; }
      .text-body { font-size: 12px; font-weight: 500; fill: #334155; }
      .text-caption { font-size: 11px; font-weight: 500; fill: #64748B; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; rx: 10px; }
      .card-header { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1; }
      .badge-sys { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 1; rx: 6px; }
      .badge-sys-text { font-size: 11px; font-weight: 700; fill: #334155; }
      .badge-active { fill: #DCFCE7; stroke: #BBF7D0; stroke-width: 1; rx: 4px; }
      .badge-active-text { font-size: 10px; font-weight: 700; fill: #15803D; }
      .btn-primary { fill: #334155; rx: 6px; }
      .btn-primary-text { font-size: 11px; font-weight: 600; fill: #FFFFFF; }
      .btn-outline { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1; rx: 6px; }
      .btn-outline-text { font-size: 11px; font-weight: 600; fill: #475569; }
      .sidebar-bg { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1; }
      .nav-item-active { fill: #F1F5F9; rx: 6px; }
      .nav-item-active-text { font-size: 12px; font-weight: 700; fill: #1E293B; }
      .nav-item-text { font-size: 12px; font-weight: 500; fill: #475569; }
    </style>
  </defs>

  <!-- Top Header -->
  <rect x="0" y="0" width="1000" height="56" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
  <rect x="20" y="12" width="32" height="32" rx="8" fill="#334155" />
  <path d="M 28 28 L 33 28 L 36 20 L 39 34 L 42 28 L 46 28" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="62" y="32" class="text-title" style="font-size: 15px;">HealthForecast <tspan fill="#334155">AI</tspan></text>
  <text x="180" y="32" class="text-subtitle" style="font-size: 11px;">/ System Governance &amp; Security Administration</text>

  <!-- Right Header: System Admin User -->
  <rect x="630" y="14" width="140" height="26" class="badge-sys" />
  <text x="700" y="31" text-anchor="middle" class="badge-sys-text">System Admin View</text>
  <circle cx="795" cy="28" r="14" fill="#E2E8F0" />
  <text x="795" y="32" text-anchor="middle" font-size="11px" font-weight="700" fill="#334155">AR</text>
  <text x="818" y="27" font-size="12px" font-weight="700" fill="#1E293B">Alex Rivera</text>
  <text x="818" y="39" class="text-caption" style="font-size: 10px;">Lead Systems Architect</text>
  <rect x="925" y="16" width="55" height="24" class="btn-outline" />
  <text x="952" y="32" text-anchor="middle" class="btn-outline-text" style="font-size: 10px;">Logout</text>

  <!-- Left Sidebar Navigation -->
  <rect x="0" y="56" width="200" height="624" class="sidebar-bg" />
  <text x="20" y="85" font-size="10px" font-weight="700" fill="#94A3B8" letter-spacing="1">SYSTEM ADMIN</text>
  
  <g transform="translate(12, 98)">
    <rect x="0" y="0" width="176" height="34" class="nav-item-active" />
    <circle cx="18" cy="17" r="4" fill="#334155" />
    <text x="32" y="21" class="nav-item-active-text">System Overview</text>
  </g>
  <g transform="translate(12, 138)">
    <rect x="0" y="0" width="176" height="34" fill="transparent" />
    <circle cx="18" cy="17" r="4" fill="#94A3B8" />
    <text x="32" y="21" class="nav-item-text">User Management</text>
  </g>
  <g transform="translate(12, 178)">
    <rect x="0" y="0" width="176" height="34" fill="transparent" />
    <circle cx="18" cy="17" r="4" fill="#94A3B8" />
    <text x="32" y="21" class="nav-item-text">RBAC Policies</text>
  </g>
  <g transform="translate(12, 218)">
    <rect x="0" y="0" width="176" height="34" fill="transparent" />
    <circle cx="18" cy="17" r="4" fill="#94A3B8" />
    <text x="32" y="21" class="nav-item-text">Audit &amp; Security Logs</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(220, 75)">
    <text x="0" y="15" class="text-title">System Administration &amp; Infrastructure Governance</text>
    <text x="0" y="32" class="text-subtitle">Global environment telemetry, security controls, and role-based access enforcement.</text>

    <!-- Scope Banner -->
    <rect x="0" y="44" width="760" height="36" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="12" y="66" font-size="11px" font-weight="600" fill="#334155">Security Status: Full Administrative Privileges Active • RBAC Enforcing 4 Role Boundaries</text>

    <!-- 4 KPI Headline Cards (System Admin) -->
    <g transform="translate(0, 92)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="178" height="84" class="card" />
      <text x="14" y="22" class="text-caption">Total System Patients</text>
      <text x="14" y="52" font-size="24px" font-weight="800" fill="#1E293B">1,240</text>
      <text x="14" y="70" font-size="10px" font-weight="600" fill="#2563EB">All Clinical Partitions</text>

      <!-- Card 2 -->
      <rect x="194" y="0" width="178" height="84" class="card" />
      <text x="208" y="22" class="text-caption">Total Admissions Recorded</text>
      <text x="208" y="52" font-size="24px" font-weight="800" fill="#1E293B">3,842</text>
      <text x="208" y="70" font-size="10px" font-weight="600" fill="#059669">System Wide</text>

      <!-- Card 3 -->
      <rect x="388" y="0" width="178" height="84" class="card" />
      <text x="402" y="22" class="text-caption">Readmissions (&lt;30d)</text>
      <text x="402" y="52" font-size="24px" font-weight="800" fill="#D97706">312</text>
      <text x="402" y="70" font-size="10px" font-weight="600" fill="#D97706">8.1% System Rate</text>

      <!-- Card 4 -->
      <rect x="582" y="0" width="178" height="84" class="card" />
      <text x="596" y="22" class="text-caption">Avg Length of Stay</text>
      <text x="596" y="52" font-size="24px" font-weight="800" fill="#1E293B">4.8 <tspan font-size="13px" font-weight="500" fill="#64748B">Days</tspan></text>
      <text x="596" y="70" font-size="10px" font-weight="600" fill="#64748B">Facility Average</text>
    </g>

    <!-- System RBAC & Governance Overview -->
    <g transform="translate(0, 192)">
      <rect x="0" y="0" width="760" height="385" class="card" />
      <rect x="0" y="0" width="760" height="42" class="card-header" rx="10" />
      <text x="16" y="26" class="text-heading">Role-Based Access Control (RBAC) &amp; Session Matrix</text>

      <line x1="0" y1="72" x2="760" y2="72" stroke="#E2E8F0" stroke-width="1" />
      <text x="16" y="62" font-size="10px" font-weight="700" fill="#64748B">CLINICAL ROLE</text>
      <text x="180" y="62" font-size="10px" font-weight="700" fill="#64748B">DATA PERMISSION SCOPE</text>
      <text x="380" y="62" font-size="10px" font-weight="700" fill="#64748B">AUTHENTICATION GUARD</text>
      <text x="560" y="62" font-size="10px" font-weight="700" fill="#64748B">SESSION ENFORCEMENT</text>
      <text x="680" y="62" font-size="10px" font-weight="700" fill="#64748B">STATUS</text>

      <!-- Role 1 -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="760" height="56" fill="#FFFFFF" />
        <line x1="0" y1="56" x2="760" y2="56" stroke="#F1F5F9" stroke-width="1" />
        <text x="16" y="28" font-size="12px" font-weight="700" fill="#1E293B">Doctor</text>
        <text x="16" y="42" class="text-caption">48 Patient Records Scoped</text>
        <text x="180" y="32" class="text-body">Assigned Patients &amp; High-Risk Flags</text>
        <text x="380" y="32" class="text-body">AuthProvider / JWT Token</text>
        <text x="560" y="32" class="text-body">Route Guard Active</text>
        <rect x="680" y="19" width="65" height="22" class="badge-active" />
        <text x="712" y="34" text-anchor="middle" class="badge-active-text">ACTIVE</text>
      </g>

      <!-- Role 2 -->
      <g transform="translate(0, 128)">
        <rect x="0" y="0" width="760" height="56" fill="#FFFFFF" />
        <line x1="0" y1="56" x2="760" y2="56" stroke="#F1F5F9" stroke-width="1" />
        <text x="16" y="28" font-size="12px" font-weight="700" fill="#1E293B">Hospital Administrator</text>
        <text x="16" y="42" class="text-caption">1,240 Patient Census</text>
        <text x="180" y="32" class="text-body">Facility KPIs &amp; Bed Occupancy</text>
        <text x="380" y="32" class="text-body">AuthProvider / JWT Token</text>
        <text x="560" y="32" class="text-body">Route Guard Active</text>
        <rect x="680" y="19" width="65" height="22" class="badge-active" />
        <text x="712" y="34" text-anchor="middle" class="badge-active-text">ACTIVE</text>
      </g>

      <!-- Role 3 -->
      <g transform="translate(0, 184)">
        <rect x="0" y="0" width="760" height="56" fill="#FFFFFF" />
        <line x1="0" y1="56" x2="760" y2="56" stroke="#F1F5F9" stroke-width="1" />
        <text x="16" y="28" font-size="12px" font-weight="700" fill="#1E293B">Healthcare Researcher</text>
        <text x="16" y="42" class="text-caption">101,766 De-identified Rows</text>
        <text x="180" y="32" class="text-body">De-identified Cohort IDs Only</text>
        <text x="380" y="32" class="text-body">AuthProvider / JWT Token</text>
        <text x="560" y="32" class="text-body">Route Guard Active</text>
        <rect x="680" y="19" width="65" height="22" class="badge-active" />
        <text x="712" y="34" text-anchor="middle" class="badge-active-text">ACTIVE</text>
      </g>

      <!-- Role 4 -->
      <g transform="translate(0, 240)">
        <rect x="0" y="0" width="760" height="56" fill="#FFFFFF" />
        <line x1="0" y1="56" x2="760" y2="56" stroke="#F1F5F9" stroke-width="1" />
        <text x="16" y="28" font-size="12px" font-weight="700" fill="#1E293B">System Administrator</text>
        <text x="16" y="42" class="text-caption">Full Global Access</text>
        <text x="180" y="32" class="text-body">Global Telemetry &amp; System Controls</text>
        <text x="380" y="32" class="text-body">AuthProvider / Root Token</text>
        <text x="560" y="32" class="text-body">Route Guard Active</text>
        <rect x="680" y="19" width="65" height="22" class="badge-active" />
        <text x="712" y="34" text-anchor="middle" class="badge-active-text">ACTIVE</text>
      </g>

      <g transform="translate(16, 310)">
        <text x="0" y="16" class="text-caption">All 4 roles verified with clean route protection and redirect workflows.</text>
        <rect x="630" y="0" width="105" height="24" class="btn-primary" />
        <text x="682" y="16" text-anchor="middle" class="btn-primary-text" style="font-size: 10px;">Audit Access Log</text>
      </g>
    </g>
  </g>
</svg>
